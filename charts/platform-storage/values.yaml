permissionExpirationInterval: 60
permissionForgettingInterval: 600
keepAliveTimeout: 75

image:
  repository: $IMAGE_REPO
  tag: $IMAGE_TAG
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 2

securityContext:
  enabled: false
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  fsGroupChangePolicy: "OnRootMismatch"

platform:
  clusterName:
  authUrl:
  adminUrl:
  eventsUrl: http://platform-events:8080/apis/events
  token: {}

resources:
  requests:
    cpu: "0.1"
    memory: "400Mi"
  limits:
    cpu: "0.3"
    memory: "800Mi"

secrets: []

externalSecrets: []
  # - name: platform-admin-secret
  #   secretStoreName: vault-backend
  #   secretStoreKind: ClusterSecretStore
  #   data:
  #     DATABASE_URL:
  #       key: kv-v2/platform
  #       property: DATABASE_URL
  #     API_KEY:
  #       key: kv-v2/platform
  #       property: API_KEY
ingress:
  enabled: false
  ingressClassName: ""
  hosts: []
  annotations: {}

service:
  annotations: {}

storages: []

sentry:
  appName: platform-storage
  sampleRate: 0.002

priorityClassName: ""

s3: {}
  # region:
  # accessKeyId: {}
  # secretAccessKey: {}
  # endpoint:
  # bucket:
  # keyPrefix:

storageUsageCollector:
  schedule: "0 * * * *" # every hour
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  # concurrencyPolicy is Forbid, so a job that keeps retrying blocks every later
  # schedule for as long as it lives: one failing job once held the hourly
  # schedule for 30 hours. Retrying inside the job is redundant when the next
  # schedule is itself the retry, and it starts with a full time budget.
  backoffLimit: 0
  # A full collection over a large storage takes hours, so the cap is generous,
  # but it is a cap.
  activeDeadlineSeconds: 43200 # 12h

  resources:
    requests:
      cpu: "0.1"
      memory: "100Mi"
    limits:
      cpu: "0.3"
      memory: "200Mi"

metrics:
  replicas: 2

  resources:
    requests:
      cpu: "0.1"
      memory: "100Mi"
    limits:
      cpu: "0.2"
      memory: "200Mi"

  service:
    port: 8080

  serviceMonitor:
    enabled: true


admissionController:
  serviceName: "storage-admission-controller"
  webhookPath: "/admission-controller/mutate"
  namespaceSelector:
    matchExpressions:
      - key: platform.apolo.us/org
        operator: Exists
      - key: platform.apolo.us/project
        operator: Exists
  objectSelector:
    matchLabels:
      platform.apolo.us/inject-storage: "true"
  failurePolicy: "Fail"
  reinvocationPolicy: "IfNeeded"
  service:
    port: 8080
